[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "turkey-domain-demo"
version = "0.1.0"
description = "Customer-service domain replacement simulation using fake data only"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
turkey-domain-preview = "turkey_domain_replacer.preview:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turkey_domain_replacer = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
